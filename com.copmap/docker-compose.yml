version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/copmap
      SPRING_DATASOURCE_USERNAME: copmap
      SPRING_DATASOURCE_PASSWORD: copmap
      SPRING_REDIS_HOST: redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: copmap
      POSTGRES_USER: copmap
      POSTGRES_PASSWORD: copmap
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
